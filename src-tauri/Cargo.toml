# Thin desktop-shell crate. Dependencies are limited to Tauri, platform APIs,
# sidecar verification, and the shared ct-engine request/response types.

[package]
name = "ct-workstation"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
ct-engine = { path = "../crates/ct-engine" }
tauri-plugin-dialog = "2"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
