# Thin desktop-shell crate. Dependencies are limited to Tauri, platform APIs,
# sidecar verification, and the shared ct-engine request/response types.

[package]
name = "ct-workstation"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
ct-engine = { path = "../crates/ct-engine" }
tauri-plugin-dialog = "2"
sha2 = "0.10.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
minisign-verify = "=0.2.5"
base64 = "0.22"
semver = { version = "1.0.28", features = ["serde"] }
zip = { version = "=4.6.1", default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
