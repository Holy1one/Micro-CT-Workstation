# Rust workspace shared by the production engine and the thin Tauri shell.
# Shared package metadata and dependency versions are declared once here so
# both crates build against the same serialization and time representations.

[workspace]
members = ["crates/ct-engine", "src-tauri"]
default-members = ["crates/ct-engine"]
resolver = "2"

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
