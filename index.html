<!doctype html>
<!--
  Browser bootstrap for the React workstation. Runtime behavior lives in
  src/main.tsx; this file only defines document metadata, the root mount node,
  and the earliest theme initialization needed to avoid a color flash.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E8EDF2" />
    <title>Micro-CT Workstation</title>
    <script>
      // Resolve the explicit user choice first, otherwise follow the OS before
      // first paint so the initial HTML and React state begin on the same theme.
      try {
        var saved = window.localStorage.getItem("micro-ct-workstation.theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (err) {
        var theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111821" : "#E8EDF2";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
