# Production domain-engine crate. Hardware I/O dependencies belong here rather
# than in Tauri so the engine remains the only owner of device and scan state.

[package]
name = "ct-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
serialport = "4.10.1"
sha2 = "0.10"
rawloader = "0.37.2"
wgpu = { version = "25.0.2", default-features = false, features = ["wgsl", "dx12", "vulkan"] }
pollster = "0.4"
getrandom = "0.3"
image = { version = "0.25.9", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Devices_PortableDevices", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant"] }
